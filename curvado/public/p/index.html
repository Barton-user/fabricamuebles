<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pieza · Leiten Com</title>
<style>
  :root {
    --bg: #f6f4f0; --card: #ffffff; --ink: #1f1d1a; --mute: #6b665e; --line: #e4e0d8;
    --accent: #e2591f; --accent-ink: #ffffff; --chip: #f1ede6; --edge: #1f1d1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --card: #211f1c; --ink: #f1eee8; --mute: #a39d93; --line: #34312c;
      --accent: #f06a2e; --accent-ink: #1b1007; --chip: #2b2925; --edge: #f1eee8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  .top { font-size: 13px; color: var(--mute); margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .modulo { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .modulo .nom { font-size: 20px; font-weight: 700; }
  .modulo .dim { color: var(--mute); font-size: 14px; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  .hero { display: flex; gap: 14px; align-items: center; }
  .globo { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink);
    display: grid; place-items: center; font-size: 30px; font-weight: 800; }
  .hero h1 { margin: 0; font-size: 22px; line-height: 1.2; }
  .codigo { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--mute); margin-top: 2px; }
  .corte { margin-top: 14px; font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
  .corte small { font-size: 14px; font-weight: 500; color: var(--mute); letter-spacing: 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0 0; }
  dt { color: var(--mute); }
  dd { margin: 0; font-weight: 600; }
  .cantos { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
  .cantos svg { flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .img { width: 100%; height: auto; display: block; border-radius: 8px; background: #fff; }
  .ubic { max-height: 340px; object-fit: contain; background: transparent; }
  .hint { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: block; text-align: center; padding: 14px 10px; border-radius: 12px; font-weight: 700;
    text-decoration: none; background: var(--accent); color: var(--accent-ink); }
  .btn.sec { background: var(--chip); color: var(--ink); }
  .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  ol.lista { list-style: none; padding: 0; margin: 0; }
  ol.lista li a { display: flex; gap: 12px; align-items: center; padding: 10px 6px; border-top: 1px solid var(--line);
    color: var(--ink); text-decoration: none; }
  ol.lista li:first-child a { border-top: 0; }
  ol.lista .n { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--mute);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  ol.lista .med { margin-left: auto; color: var(--mute); font-size: 13px; white-space: nowrap; }
  ol.lista li.actual a { background: var(--chip); border-radius: 10px; }
  ol.lista li.actual .n { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .aviso { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--chip); border-radius: 6px; margin-top: 12px; font-size: 14px; }
  .error { text-align: center; padding: 48px 16px; }
  footer { color: var(--mute); font-size: 12px; text-align: center; margin-top: 18px; }
  @media (max-width: 420px) { .corte { font-size: 28px; } .botones { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"><p class="top">Cargando…</p></main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");

  function codigoDeUrl() {
    var q = new URLSearchParams(location.search).get("c");
    if (q) return q.trim();
    var partes = location.pathname.split("/").filter(Boolean);
    return partes.length ? decodeURIComponent(partes[partes.length - 1]) : "";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function x2(s) { return String(s).replace(/ x /g, " × "); }

  function cantosSvg(p) {
    var W = parseFloat(p.W) || 1, H = parseFloat(p.H) || 1;
    var max = 70, s = max / Math.max(W, H), w = Math.max(W * s, 14), h = Math.max(H * s, 14);
    var x = 6, y = 6, L = p.cantos_lados || {};
    var out = '<svg width="' + (w + 12) + '" height="' + (h + 12) + '" viewBox="0 0 ' + (w + 12) + " " + (h + 12) + '" aria-hidden="true">';
    out += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="none" stroke="var(--mute)" stroke-width="1"/>';
    var t = 4, c = "var(--edge)";
    if (L.arriba) out += '<rect x="' + x + '" y="' + (y - t / 2) + '" width="' + w + '" height="' + t + '" fill="' + c + '"/>';
    if (L.abajo) out += '<rect x="' + x + '" y="' + (y + h - t / 2) + '" width="' + w + '" height="' + t + '" fill="' + c + '"/>';
    if (L.izq) out += '<rect x="' + (x - t / 2) + '" y="' + y + '" width="' + t + '" height="' + h + '" fill="' + c + '"/>';
    if (L.der) out += '<rect x="' + (x + w - t / 2) + '" y="' + y + '" width="' + t + '" height="' + h + '" fill="' + c + '"/>';
    return out + "</svg>";
  }

  function render(d) {
    var m = d.modulo, p = d.pieza;
    document.title = p.n + " · " + p.nombre + " · " + m.nombre;
    var cantos = p.cantos && p.cantos.length ? "Canto en: " + p.cantos.join(", ") : "Sin canto";
    var mec = (p.mecanizados || []).map(function (x) {
      return '<span class="chip">' + x.n + " × " + esc(x.tipo) + "</span>";
    }).join("") || '<span class="chip">Sin mecanizados</span>';
    var lista = m.piezas.map(function (x) {
      return '<li class="' + (x.codigo === d.codigo ? "actual" : "") + '"><a href="/p/' + encodeURIComponent(x.codigo) + '">' +
        '<span class="n">' + x.n + "</span><span>" + esc(x.nombre) + '</span><span class="med">' + esc(x2(x.medida)) + "</span></a></li>";
    }).join("");
    var manual = m.manual
      ? '<a class="btn sec" href="' + esc(m.manual) + '" target="_blank" rel="noopener">Manual de armado</a>'
      : '<a class="btn sec" aria-disabled="true" href="#">Manual de armado (en preparación)</a>';

    app.innerHTML =
      '<p class="top">Leiten Com · ' + esc(d.ambiente) + " · Orden " + esc(d.orden) + "</p>" +
      '<section class="card modulo"><div><div class="tag">Módulo ' + m.n + " de " + m.total + '</div>' +
        '<div class="nom">' + esc(m.nombre) + "</div></div>" +
        '<div class="dim">' + m.ancho + " × " + m.alto + " × " + m.prof + " mm</div></section>" +

      '<section class="card"><div class="hero"><div class="globo">' + p.n + "</div><div>" +
        "<h1>" + esc(p.nombre) + '</h1><div class="codigo">' + esc(d.codigo) + "</div></div></div>" +
        '<div class="corte">' + esc(x2(p.corte)) + " × " + esc(p.espesor) + " <small>mm de corte</small></div>" +
        "<dl><dt>Terminada</dt><dd>" + esc(x2(p.terminada)) + " mm</dd>" +
        "<dt>Material</dt><dd>" + esc(p.material) + "</dd>" +
        "<dt>Color</dt><dd>" + esc(p.color) + "</dd>" +
        "<dt>Veta</dt><dd>" + esc(p.veta) + "</dd></dl>" +
        '<div class="cantos">' + cantosSvg(p) + "<div>" + esc(cantos) + "</div></div>" +
        '<div class="chips">' + mec + "</div>" +
        (p.aviso ? '<div class="aviso">' + esc(p.aviso) + "</div>" : "") +
      "</section>" +

      '<section class="card"><h2>Dónde va en el mueble</h2>' +
        '<img class="img ubic" src="' + esc(d.ubicacion) + '" alt="Módulo ' + esc(m.nombre) + ' con la pieza resaltada"></section>' +

      '<section class="card"><h2>Plano de la pieza</h2>' +
        '<a href="' + esc(d.plano) + '" target="_blank" rel="noopener"><img class="img" src="' + esc(d.plano) +
        '" alt="Plano acotado de ' + esc(p.nombre) + '" loading="lazy"></a>' +
        '<div class="hint">Tocá el plano para verlo completo y hacer zoom.</div></section>' +

      '<section class="botones"><a class="btn" href="' + esc(m.pdf) + '" target="_blank" rel="noopener">Planos del módulo (PDF)</a>' +
        manual + "</section>" +

      '<section class="card" style="margin-top:14px"><h2>Piezas de este módulo</h2><ol class="lista">' + lista + "</ol></section>" +
      "<footer>Generado desde GuiGui" + (d.guardado ? " · modelo guardado el " + esc(d.guardado) : "") + "</footer>";
  }

  function error(msg) {
    app.innerHTML = '<div class="card error"><h1 style="font-size:20px;margin:0 0 8px">Pieza no encontrada</h1>' +
      '<p style="color:var(--mute);margin:0">' + esc(msg) + "</p></div>";
  }

  var codigo = codigoDeUrl();
  if (!/^[0-9A-Za-z_-]{4,40}$/.test(codigo)) { error("La dirección no trae un código de pieza válido."); return; }
  fetch("/pz/c/" + encodeURIComponent(codigo) + ".json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(render)
    .catch(function () { error("No hay datos publicados para el código " + codigo + "."); });
})();
</script>
</body>
</html>
